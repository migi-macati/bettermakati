name: Source freshness monitor

on:
  schedule:
    # 08:30 Philippine time every day.
    - cron: '30 0 * * *'
    # 08:40 Philippine time every Monday.
    - cron: '40 0 * * 1'
    # 08:50 Philippine time on the first day of every month.
    - cron: '50 0 1 * *'
  workflow_dispatch:
    inputs:
      cadence:
        description: Source cadence to check
        required: true
        default: all
        type: choice
        options:
          - all
          - daily
          - weekly
          - monthly

permissions:
  contents: write

concurrency:
  group: source-freshness-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Select source cadence
        id: cadence
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            cadence="${{ inputs.cadence }}"
          else
            case "${{ github.event.schedule }}" in
              '30 0 * * *') cadence="daily" ;;
              '40 0 * * 1') cadence="weekly" ;;
              '50 0 1 * *') cadence="monthly" ;;
              *) cadence="all" ;;
            esac
          fi
          echo "cadence=$cadence" >> "$GITHUB_OUTPUT"

      - name: Check configured public sources
        run: node scripts/check-sources.mjs --cadence=${{ steps.cadence.outputs.cadence }}

      - name: Verify production build
        run: npm run build

      - name: Publish machine-generated freshness state
        shell: bash
        run: |
          git add data/source-watch-state.json data/source-watch-history.json data/source-watch-report.md

          if git diff --cached --quiet; then
            echo "No source-freshness state change to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: publish ${{ steps.cadence.outputs.cadence }} source freshness"

          git pull --rebase origin main
          git push origin HEAD:main
