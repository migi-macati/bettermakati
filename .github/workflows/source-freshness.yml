name: Source freshness monitor

on:
  schedule:
    # 08:00 Philippine time every day. The checker selects daily sources
    # plus weekly sources on Mondays and monthly sources on the first day.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      cadence:
        description: Source cadence to check
        required: true
        default: all
        type: choice
        options:
          - all
          - daily
          - weekly
          - monthly

permissions:
  contents: write
  issues: write

concurrency:
  group: source-freshness-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Select source cadence
        id: cadence
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            cadence="${{ inputs.cadence }}"
          else
            cadence="due"
          fi
          echo "cadence=$cadence" >> "$GITHUB_OUTPUT"

      - name: Check configured public sources
        run: node scripts/check-sources.mjs --cadence=${{ steps.cadence.outputs.cadence }}

      - name: Build consolidated freshness review queue
        run: npm run build:freshness-queue


      - name: Check whether published freshness state changed
        id: publish
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const state = JSON.parse(fs.readFileSync('data/source-watch-state.json', 'utf8'));
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            'publish_required=' + String(Boolean(state.publishRequired)) + '\n'
          );
          NODE


      - name: Detect editorial review queue
        id: review
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const queue = JSON.parse(fs.readFileSync('data/freshness-review-queue.json', 'utf8'));
          const needsReview = Number(queue.summary?.open || 0) > 0;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'needs_review=' + String(needsReview) + '\n');
          NODE

      - name: Open or update source freshness review issue
        if: steps.review.outputs.needs_review == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = 'Freshness review queue';
            const report = fs.readFileSync('data/freshness-review-queue.md', 'utf8');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: report,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: report,
              });
            }

      - name: Verify production build
        if: steps.publish.outputs.publish_required == 'true'
        run: npm run build

      - name: Publish machine-generated freshness state
        if: steps.publish.outputs.publish_required == 'true'
        shell: bash
        run: |
          git add data/source-watch-state.json data/source-watch-history.json data/source-watch-report.md data/freshness-review-queue.json data/freshness-review-queue.md

          if git diff --cached --quiet; then
            echo "No source-freshness state change to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: publish ${{ steps.cadence.outputs.cadence }} source freshness"

          git pull --rebase origin main
          git push origin HEAD:main
