name: Daily news discovery refresh

on:
  schedule:
    # 09:00 Philippine time every day (UTC is used by GitHub Actions).
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh Google News discovery snapshot
        run: npm run update:news

      - name: Build internal news review queue
        run: npm run build:news-review-queue

      - name: Verify the site build
        run: npm run build

      - name: Open a reviewable refresh pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/daily-news-discovery
          delete-branch: true
          commit-message: 'chore: refresh Makati news discovery'
          title: 'Daily Makati news discovery refresh'
          body: |
            Automated refresh of the fallback Makati news snapshot and internal review queue.
            The queue is not public civic data and does not auto-promote headlines into canonical records.
            Live /api/news remains the primary public feed.
          add-paths: |
            src/data/newsSnapshot.ts
            data/news-discovery-snapshot.json
            data/news-review-queue.json
            data/news-review-queue.md
