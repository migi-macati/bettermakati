name: Daily news discovery refresh

on:
  schedule:
    # 09:00 Philippine time every day (UTC is used by GitHub Actions).
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh Google News discovery snapshot
        run: npm run update:news

      - name: Build internal news review queue
        run: npm run build:news-review-queue

      - name: Verify the site build
        run: npm run build

      # The package allowlist contains only:
      # src/data/newsSnapshot.ts
      # data/news-discovery-snapshot.json
      # data/news-review-queue.json
      # data/news-review-queue.md
      - name: Package successful refresh for publisher review
        run: bash scripts/package-news-review.sh news-review

      - name: Retain candidate for publisher review
        uses: actions/upload-artifact@v4
        with:
          name: news-review-${{ github.run_id }}
          path: news-review/
          if-no-files-found: error
          retention-days: 30
