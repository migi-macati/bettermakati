name: Prepare Civic Brief review

on:
  schedule:
    # 09:05 Philippine time every day.
    - cron: '5 1 * * *'
    # 09:10 Philippine time every Monday.
    - cron: '10 1 * * 1'
    # 09:15 Philippine time on the first day of every month.
    - cron: '15 1 1 * *'
  workflow_dispatch:
    inputs:
      cadence:
        description: Brief cadence to prepare
        required: true
        default: daily
        type: choice
        options:
          - daily
          - weekly
          - monthly

permissions:
  contents: read

concurrency:
  group: scheduled-main-writer
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Select brief cadence
        id: cadence
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            cadence="${{ inputs.cadence }}"
          else
            case "${{ github.event.schedule }}" in
              '5 1 * * *') cadence="daily" ;;
              '10 1 * * 1') cadence="weekly" ;;
              '15 1 1 * *') cadence="monthly" ;;
              *) cadence="daily" ;;
            esac
          fi
          echo "cadence=$cadence" >> "$GITHUB_OUTPUT"

      - name: Generate source-backed brief candidate
        run: node scripts/generate-civic-brief.mjs --cadence=${{ steps.cadence.outputs.cadence }}

      - name: Verify production build
        run: npm run build

      - name: Package candidate for publisher review
        run: bash scripts/package-civic-brief-review.sh civic-brief-review

      - name: Retain candidate and exact base for review
        uses: actions/upload-artifact@v4
        with:
          name: civic-brief-review-${{ steps.cadence.outputs.cadence }}-${{ github.run_id }}
          path: civic-brief-review/
          if-no-files-found: error
          retention-days: 30
