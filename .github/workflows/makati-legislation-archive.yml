name: Makati legislation archive extraction

on:
  push:
    branches:
      - main
    paths:
      - scripts/discover-makati-legislation-archive.mjs
      - .github/workflows/makati-legislation-archive.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Enumerate official Makati archive
        run: node scripts/discover-makati-legislation-archive.mjs

      - name: Upload dated raw snapshot
        uses: actions/upload-artifact@v4
        with:
          name: makati-legislation-archive-snapshot
          path: data/makati-legislation-archive-*.json
          if-no-files-found: error
          retention-days: 14

      - name: Commit dated raw snapshot
        run: |
          SNAPSHOT="$(ls -1t data/makati-legislation-archive-*.json | head -1)"
          git config user.name "BetterMakati Archive Bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$SNAPSHOT"
          if git diff --cached --quiet; then
            echo "Snapshot unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "Snapshot official Makati legislation archive"
          git push origin HEAD:main
