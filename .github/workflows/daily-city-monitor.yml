name: Daily City Monitor

on:
  schedule:
    # 08:30 Philippine time every day (UTC is used by GitHub Actions).
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check official City Monitor sources
        run: npm run check:city-monitor

      - name: Verify production build
        run: npm run build

      - name: Open reviewable City Monitor pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/daily-city-monitor
          delete-branch: true
          commit-message: 'chore: refresh City Monitor source state'
          title: 'Daily City Monitor source refresh'
          body-path: data/city-monitor-report.md
          add-paths: |
            data/city-monitor-source-state.json
            data/city-monitor-source-history.json
            data/city-monitor-report.md
