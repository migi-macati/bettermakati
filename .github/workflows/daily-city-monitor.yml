name: Daily City Monitor

on:
  schedule:
    # 08:30 Philippine time every day (UTC is used by GitHub Actions).
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: freshness-main-writer
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check official City Monitor sources
        run: npm run check:city-monitor

      - name: Build consolidated freshness review queue
        run: npm run build:freshness-queue


      - name: Check whether published monitor state changed
        id: publish
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const state = JSON.parse(fs.readFileSync('data/city-monitor-source-state.json', 'utf8'));
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            'publish_required=' + String(Boolean(state.publishRequired)) + '\n'
          );
          NODE


      - name: Verify production build
        if: steps.publish.outputs.publish_required == 'true'
        run: npm run build

      - name: Publish monitor state when changed
        id: publish_git
        if: steps.publish.outputs.publish_required == 'true'
        shell: bash
        run: |
          git add \
            data/city-monitor-source-state.json \
            data/city-monitor-source-history.json \
            data/city-monitor-report.md \
            data/freshness-review-queue.json \
            data/freshness-review-queue.md \
            data/page-freshness-state.json \
            data/freshness-history.json

          if git diff --cached --quiet; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "No material freshness state change to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh City Monitor source state"

          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Generated freshness state conflicted with main; refusing to overwrite."
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Push attempt $attempt failed because main moved; retrying after rebase."
            sleep $((attempt * 5))
          done

          echo "Unable to publish generated freshness state after 3 attempts."
          exit 1

      - name: Sync freshness review issue
        if: steps.publish_git.outputs.published == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = 'Freshness review queue';
            const report = fs.readFileSync('data/freshness-review-queue.md', 'utf8');
            const queue = JSON.parse(fs.readFileSync('data/freshness-review-queue.json', 'utf8'));
            const openCount = Number(queue.summary?.open || 0);
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const matches = issues
              .filter(issue => !issue.pull_request && issue.title === title)
              .sort((a, b) => a.number - b.number);
            const canonical = matches[0];

            for (const duplicate of matches.slice(1)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: duplicate.number,
                body: canonical
                  ? 'Closing duplicate freshness review queue. Continue in #' + canonical.number + '.'
                  : 'Closing duplicate freshness review queue.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: duplicate.number,
                state: 'closed',
              });
            }

            if (openCount > 0) {
              if (canonical) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: canonical.number,
                  body: report,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body: report,
                });
              }
            } else if (canonical) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: canonical.number,
                body: 'Freshness review queue cleared. No open items remain in the latest published state.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: canonical.number,
                state: 'closed',
              });
            }
