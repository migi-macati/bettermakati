name: Daily City Monitor

on:
  schedule:
    # 08:30 Philippine time every day (UTC is used by GitHub Actions).
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-city-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check official City Monitor sources
        run: npm run check:city-monitor

      - name: Verify production build
        run: npm run build

      - name: Publish monitor state when changed
        shell: bash
        run: |
          git add             data/city-monitor-source-state.json             data/city-monitor-source-history.json             data/city-monitor-report.md

          if git diff --cached --quiet; then
            echo "No actionable City Monitor changes to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore: refresh City Monitor source state"

          # Do not force-push. If main changed during this run, rebase the
          # generated commit on the latest main and fail safely on conflicts.
          git pull --rebase origin main
          git push origin HEAD:main
