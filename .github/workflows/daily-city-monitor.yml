name: Daily City Monitor

on:
  schedule:
    # 08:30 Philippine time every day (UTC is used by GitHub Actions).
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-city-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check official City Monitor sources
        run: npm run check:city-monitor

      - name: Build consolidated freshness review queue
        run: npm run build:freshness-queue


      - name: Check whether published monitor state changed
        id: publish
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const state = JSON.parse(fs.readFileSync('data/city-monitor-source-state.json', 'utf8'));
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            'publish_required=' + String(Boolean(state.publishRequired)) + '\n'
          );
          NODE


      - name: Detect consolidated editorial review queue
        id: review
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const queue = JSON.parse(fs.readFileSync('data/freshness-review-queue.json', 'utf8'));
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            'needs_review=' + String(Number(queue.summary?.open || 0) > 0) + '\n'
          );
          NODE

      - name: Open or update freshness review issue
        if: steps.review.outputs.needs_review == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = 'Freshness review queue';
            const report = fs.readFileSync('data/freshness-review-queue.md', 'utf8');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: report,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: report,
              });
            }

      - name: Verify production build
        if: steps.publish.outputs.publish_required == 'true'
        run: npm run build

      - name: Publish monitor state when changed
        if: steps.publish.outputs.publish_required == 'true'
        shell: bash
        run: |
          git add             data/city-monitor-source-state.json             data/city-monitor-source-history.json             data/city-monitor-report.md             data/freshness-review-queue.json             data/freshness-review-queue.md

          if git diff --cached --quiet; then
            echo "No actionable City Monitor changes to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore: refresh City Monitor source state"

          # Do not force-push. If main changed during this run, rebase the
          # generated commit on the latest main and fail safely on conflicts.
          git pull --rebase origin main
          git push origin HEAD:main
